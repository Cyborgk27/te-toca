<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Te Toca · Rotación de oficina</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Quién va a la oficina esta semana. Rotación de lunes y martes cada 4 semanas, con feriados y avisos."
    />
    <meta name="theme-color" content="#c4007a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('te-toca-theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
